name: Update Projects from GitHub

on:
  schedule:
    - cron: '0 6 * * *'          # every day at 06:00 UTC
  workflow_dispatch:             # manual trigger from GitHub UI
  push:
    paths:
      - 'scripts/fetch-projects.js'
      - '.github/workflows/update-projects.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch & generate projects.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/fetch-projects.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git diff --staged --quiet || git commit -m "chore: update projects from GitHub $(date -u +%Y-%m-%d)"
          git push
